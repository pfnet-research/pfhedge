# Backtest Configuration for perp1 model
# Model trained with: perpetual, 500 epochs, 5k paths, [64,32,32,16] units, vol=0.2, cost=0.0001

# Dates (using available data range)
start_date: "2025-08-15"
end_date: "2025-10-27"

# Option parameters (matching training)
strike: 110000
maturity_days: 33
call: true

# Bootstrap mode
bootstrap_mode: "normalize_spot"
initial_spot: 109325.75

# Model path
model_path: "models/es_05_roll_vol_20_adamw"

# Backtest parameters
n_bootstrap_paths: 100
transaction_cost: 0.0001  # 0.01% to match training
dt_hours: 8.0
underlying_type: "spot"  # "spot" or "perpetual" - MUST match training!

# Data
data_dir: "crypto/data/historical"
data_file: "btc_spot_8H_2025-01-01_2025-10-28.parquet"
output_dir: "backtest_results/es_05_roll_vol_20_adamw"
