option_file: "crypto/data/options_2025-09-28_monthly_atm_110k.json"
instrument: "BTC-31OCT25-110000-C"

# Architecture
model_type: "enhanced_mlp"
n_layers: 3
n_units: [128, 64, 32]

# Minimal training for local testing
n_epochs: 3
n_paths: 1000
learning_rate: 0.0002
optimizer: "adamw"
device: "cpu"

# Features
features:
  - "log_moneyness"
  - "expiry_time"
  - "volatility"
  - "prev_hedge"
  - "volatility_change"
  - "moneyness_squared"

# Risk parameters
risk_measure: "entropic"
risk_param: 1.8
tail_penalty_weight: 0.3
tail_penalty_ramp: true

# Market parameters
transaction_cost: 0.0004
dt_hours: 8.0
underlying_type: "spot"
band_width: 0.001

# Regularization
grad_clip_norm: 2.0
weight_decay: 0.0001
feature_dropout: 0.15

# Training tricks
bs_warmup_epochs: 0
bs_anchor_weight: 0.08
const_position_penalty: 0.02

# Early stopping disabled for quick test
early_stopping: false

# Volatility parameters
volatility: 0.42
volatility_window: 20

# Mixed precision disabled for CPU
use_amp: false

# Output
model_path: "models/iteration_20_test"
seed: 42
