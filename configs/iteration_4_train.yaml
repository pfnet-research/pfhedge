option_file: "crypto/data/options_2025-09-28_monthly_atm_110k.json"
instrument: "BTC-31OCT25-110000-C"

# Architecture - KEEP LARGER MODEL (from iteration 1)
n_layers: 4  # KEEP: Model has capacity
n_units: 128  # KEEP: Larger model worked in BS warmup phase

# Training parameters - EXTENDED FOR QUADRATIC CVAR
n_epochs: 250  # INCREASE: QuadraticCVaR needs more epochs (harder optimization)
n_paths: 500000  # KEEP: Accept memory constraint (1M causes OOM)
learning_rate: 0.0005  # KEEP: Lower LR is safer for larger model
optimizer: "adamw"
device: "cuda"  # For remote GPU training

# Features - BASELINE FEATURES
features:
  - "log_moneyness"
  - "expiry_time"
  - "volatility"
  - "prev_hedge"

# Risk parameters - QUADRATIC CVAR APPROACH (MAIN CHANGE)
risk_measure: "quadratic_cvar"  # CHANGE: entropic -> quadratic_cvar for tail risk
risk_param: 2.0  # CHANGE: lambda=2.0 (standard QuadraticCVaR parameter, Buehler 2019)

# Market parameters
transaction_cost: 0.0006
dt_hours: 8.0
underlying_type: "perpetual"

# Regularization - CONSERVATIVE VALUES
const_position_penalty: 0.0
bs_anchor_weight: 0.0  # Not needed without curriculum
grad_clip_norm: 5.0  # KEEP: Worked well, no gradient explosions
weight_decay: 0.0001  # Baseline value, less aggressive

# Training tricks - NO CURRICULUM
bs_warmup_epochs: 0  # No warmup
curriculum_ramp_epochs: 0  # No curriculum

# Early stopping - DISABLED
early_stopping: false  # Let model train full 250 epochs
patience: 10

# Output
model_path: "models/iteration_4"
seed: 42
