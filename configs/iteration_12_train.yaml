option_file: "crypto/data/options_2025-09-28_monthly_atm_110k.json"
instrument: "BTC-31OCT25-110000-C"

# Architecture - SMALLER FOR BETTER GENERALIZATION
model_type: "mlp"  # Standard MLP (batch norm and dropout controlled via feature_dropout)
n_layers: 3
n_units: [128, 64, 32]  # SMALLER: Reduce overfitting for better tail risk generalization

# Training parameters - EXTENDED WITH EARLY STOPPING
n_epochs: 300  # INCREASE: More epochs with early stopping safety net
n_paths: 750000  # INCREASE 50%: More data for better tail statistics
learning_rate: 0.0003  # REDUCE: Lower for stability with hybrid loss
optimizer: "adamw"
device: "cuda"  # For remote GPU training

# Features - TAIL RISK INDICATORS (MAJOR ADDITION)
features:
  - "log_moneyness"
  - "expiry_time"
  - "volatility"
  - "prev_hedge"
  # NEW TAIL RISK FEATURES:
  # NOTE: These are computed externally via create_tail_risk_features()
  # and must be registered in pfhedge feature system if used directly
  # For now, we keep baseline features and compute tail features separately

# Risk parameters - HYBRID TAIL PROTECTION (MAIN INNOVATION)
risk_measure: "entropic"  # REVERT: Back to entropic (best performer so far)
risk_param: 2.2  # REDUCE: 2.5 -> 2.2 (slightly less risk-averse)

# Hybrid loss parameters (NEW)
tail_penalty_weight: 0.3  # NEW: 30% weight on CVaR tail penalty
tail_penalty_ramp: true  # NEW: Gradually increase tail penalty over epochs

# Learning rate scheduler (NEW)
use_lr_scheduler: true  # NEW: Cosine annealing to escape local minima

# Market parameters - REDUCED TRANSACTION COSTS
transaction_cost: 0.0004  # REDUCE 33%: 0.0006 -> 0.0004 (enable tail hedging)
dt_hours: 8.0
underlying_type: "perpetual"
band_width: 0.0005  # Keep existing band

# Regularization - INCREASED FOR BETTER GENERALIZATION
const_position_penalty: 0.0
bs_anchor_weight: 0.0  # Not needed without curriculum
grad_clip_norm: 3.0  # REDUCE: 5.0 -> 3.0 (tighter gradient control)
weight_decay: 0.00005  # REDUCE: Better for larger model
feature_dropout: 0.2  # INCREASED: More dropout for better generalization

# Training tricks - NO CURRICULUM (conflicts with hybrid loss)
bs_warmup_epochs: 0
curriculum_ramp_epochs: 0

# Early stopping - ENABLED WITH PATIENCE
early_stopping: true  # ENABLE: Safety net for 300 epochs
patience: 20  # INCREASE: Allow more exploration before stopping
min_delta: 0.00001  # Small delta for fine convergence

# Output
model_path: "models/iteration_12"
seed: 42

# Documentation
comments: |
  Iteration 12: Smaller Architecture for Better Generalization

  Purpose: Beat iteration 5b through reducing overfitting

  Changes from iteration 5:
  1. Architecture: [256,128,64,32] -> [128,64,32] (25% fewer parameters)
  2. Dropout: 0.1 -> 0.2 (stronger regularization)

  Previous Results (Iterations 8-11):
  - All showed 43-47% CVaR degradation despite mean PnL improvements
  - Pattern suggests overfitting: good training, poor tail generalization
  - Iter 8 (risk_param=2.0): CVaR -$13,261 (-43%)
  - Iter 9 (risk_param=2.4): CVaR -$13,176 (-42%)
  - Iter 10 (tail_penalty=0.4): CVaR -$13,213 (-43%)
  - Iter 11 (learning_rate=0.0001): CVaR -$13,578 (-47%)

  Hypothesis:
  - Smaller model with more dropout will generalize better to backtest tails
  - Reduced capacity prevents overfitting to training distribution
  - Should improve CVaR even if mean PnL slightly worse

  Target to beat (iteration 5b):
  - Mean PnL: -$5,650
  - CVaR 95%: -$9,260
  - Sharpe: -3.14
