option_file: "crypto/data/options_2025-09-28_monthly_atm_110k.json"
instrument: "BTC-31OCT25-110000-C"

# Architecture - STANDARD MLP (PROVEN)
model_type: "mlp"  # Back to standard mlp - proven architecture
n_layers: 4
n_units: [256, 128, 64, 32]  # Keep pyramid structure from 5b

# Training parameters - INCREASED PATHS
n_epochs: 300
n_paths: 750000  # MATCH iteration 5b (proven to work reliably)
learning_rate: 0.0003
optimizer: "adamw"
device: "cuda"

# Features - Same as 5b
features:
  - "log_moneyness"
  - "expiry_time"
  - "volatility"
  - "prev_hedge"

# Risk parameters - TUNING: Test more aggressive risk aversion
risk_measure: "entropic"
risk_param: 2.0

# Hybrid loss parameters - Same as 5b
tail_penalty_weight: 0.3
tail_penalty_ramp: true

# Learning rate scheduler
use_lr_scheduler: true

# Market parameters - Same as 5b
transaction_cost: 0.0004
dt_hours: 8.0
underlying_type: "perpetual"
band_width: 0.0005

# Regularization - Same as 5b
const_position_penalty: 0.0
bs_anchor_weight: 0.0
grad_clip_norm: 3.0
weight_decay: 0.00005
feature_dropout: 0.1

# Training tricks
bs_warmup_epochs: 0
curriculum_ramp_epochs: 0

# Early stopping
early_stopping: true
patience: 20
min_delta: 0.00001

# Output
model_path: "models/iteration_8"
seed: 42

# Documentation
comments: |
  Iteration 8: Hyperparameter Tuning - risk_param

  Purpose: Beat iteration 5b through hyperparameter optimization

  Changes from iteration 5b:
  1. risk_param: 2.2 -> 2.0 (more aggressive risk aversion)

  Rationale:
  - risk_param historically most impactful parameter
  - Lower value = more aggressive risk aversion
  - Should improve CVaR (tail risk protection)
  - May slightly worsen mean PnL but target overall improvement

  Target to beat (iteration 5b):
  - Mean PnL: -$5,650
  - CVaR 95%: -$9,260
  - Sharpe: -3.14

  Hypothesis:
  - risk_param=2.0 will improve CVaR by 5-10%
  - Mean PnL may worsen slightly but overall better risk-adjusted returns
