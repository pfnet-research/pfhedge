option_file: "crypto/data/options_2025-09-28_monthly_atm_110k.json"
instrument: "BTC-31OCT25-110000-C"

# Architecture - Enhanced MLP with dropout and layer normalization
model_type: "enhanced_mlp"
n_layers: 3
n_units: [128, 64, 32]

# Training parameters - Increased scale for better convergence
n_epochs: 400
n_paths: 1000000
learning_rate: 0.0002
optimizer: "adamw"
device: "cuda"

# Features - Enhanced with volatility dynamics and non-linear moneyness
features:
  - "log_moneyness"
  - "expiry_time"
  - "volatility"        # 20-period
  - "prev_hedge"
  - "volatility_change" # NEW: Captures vol dynamics
  - "moneyness_squared" # NEW: Non-linear gamma effects

# Risk parameters - Adjusted for better mean/tail balance
risk_measure: "entropic"
risk_param: 1.8                # REDUCED from 2.2 (less risk-averse)
tail_penalty_weight: 0.3       # REDUCED from 0.5 (focus on mean)
tail_penalty_ramp: true        # Gradual tail protection

# Learning rate scheduler
use_lr_scheduler: true

# Market parameters - Spot underlyer
transaction_cost: 0.0004
dt_hours: 8.0
underlying_type: "spot"
band_width: 0.001

# Regularization
grad_clip_norm: 2.0
weight_decay: 0.0001
feature_dropout: 0.15          # Dropout for enhanced_mlp

# Training tricks - BS warmup with light anchor
bs_warmup_epochs: 20
curriculum_ramp_epochs: 15
bs_anchor_weight: 0.08
const_position_penalty: 0.02   # NEW: Volatility-weighted turnover penalty

# Early stopping
early_stopping: true
patience: 25
min_delta: 0.00005

# Volatility parameters
volatility: 0.42
volatility_window: 20

# Mixed precision training
use_amp: true

# Output
model_path: "models/iteration_20"
seed: 42

# Documentation
comments: |
  Iteration 20: Enhanced Architecture + Rich Features + Optimized Hyperparameters

  Base Model: Iteration 19b (Mean PnL: -$2,645, CVaR: -$9,417, Sharpe: -0.776, Win Rate: 22.4%)

  Major Changes:
  1. ✅ model_type: mlp → enhanced_mlp
     - Adds dropout (0.15) and layer normalization
     - Better generalization for deeper networks
     - Reduces overfitting risk

  2. ✅ Architecture: [256, 128, 64, 32] → [128, 64, 32]
     - Simpler architecture (3 layers vs 4)
     - Enhanced MLP's normalization compensates for reduced capacity
     - Faster training, less overfitting

  3. ✅ New Features: volatility_change, moneyness_squared
     - volatility_change: Captures vol dynamics crucial for spot hedging
     - moneyness_squared: Non-linear gamma effects near ATM
     - Total features: 4 → 6

  4. ✅ Risk Parameters: risk_param 2.2 → 1.8, tail_penalty 0.5 → 0.3
     - Less risk-averse for better mean PnL
     - Tail protection maintained but not dominating
     - Enable tail_penalty_ramp for gradual protection

  5. ✅ Training Scale: 750k → 1M paths, 300 → 400 epochs
     - More data for better convergence
     - Increased patience (20 → 25) for deeper exploration

  6. ✅ Volatility-weighted turnover penalty: 0.0 → 0.02
     - Scales by market volatility (higher vol = higher penalty)
     - Reduces excessive rebalancing in volatile periods

  7. ✅ Learning rate: 0.0003 → 0.0002
     - Slower learning for more stable convergence
     - Matches increased training epochs

  Implementation Details:
  - CVaR calculation: worst 10% (increased from 5% for robustness)
  - Feature computation: volatility_change added to BitcoinEuropeanOption
  - Position penalty: volatility-weighted in trainer._compute_loss
  - Enhanced MLP: Implemented with LayerNorm + Dropout in enhanced_mlp.py

  Rationale:
  - Spot underlyer (19b) was successful, now optimize around it
  - Enhanced architecture prevents overfitting with richer features
  - Volatility dynamics crucial for spot market without funding rates
  - Lower risk_param + reduced tail penalty → better mean PnL
  - Volatility-aware penalties adapt to market conditions
  - Increased scale ensures convergence with more complex model

  Expected Results:
  - Mean PnL: -$2,200 to -$1,800 (17-32% improvement)
  - CVaR 95%: -$8,500 to -$8,000 (10-15% improvement)
  - Sharpe: -0.65 to -0.55 (15-30% improvement)
  - Win Rate: 26-30% (4-8pp improvement)
  - BS Correlation: 0.88-0.92 (similar)

  Risk Assessment:
  - Enhanced MLP may overfit → mitigated by dropout + early stopping
  - Lower risk_param could increase tail risk → mitigated by tail_penalty_ramp
  - More features may reduce interpretability → monitor feature importance

  Validation Protocol:
  1. Check hedge positions (0.4-0.6 mean, reasonable std)
  2. Compare to iteration 19b baseline
  3. Monitor training convergence (no early plateaus)
  4. Verify all features contribute (not zero weights)
  5. Check tail metrics don't deteriorate significantly

  Risk: MEDIUM (multiple changes, architecture change)
  Complexity: MEDIUM (code changes + config tuning)
