option_file: "crypto/data/options_2025-09-28_monthly_atm_110k.json"
instrument: "BTC-31OCT25-110000-C"

# Architecture - SMALL FOR TESTING
n_layers: 2
n_units: 32

# Training parameters - MINIMAL FOR TESTING
n_epochs: 3
n_paths: 1000
learning_rate: 0.001
optimizer: "adamw"
device: "cuda"

# Features
features:
  - "log_moneyness"
  - "expiry_time"
  - "volatility"

# Risk parameters
risk_measure: "expected_shortfall"
risk_param: 0.9

# Market parameters
transaction_cost: 0.0006
dt_hours: 8.0
underlying_type: "perpetual"

# Regularization
const_position_penalty: 0.0
bs_anchor_weight: 0.0
grad_clip_norm: null

# Training tricks
bs_warmup_epochs: 0
curriculum_ramp_epochs: 0

# Output
model_path: "models/test_iteration"
seed: 42
